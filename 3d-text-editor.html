<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Text Editor – Amalgamation</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#08081a; overflow:hidden; }
canvas { display:block; }
#ui {
  position:fixed; top:14px; left:16px;
  color:#667799; font:11px/2 monospace;
  pointer-events:none;
}
#ui b { color:#99ccff; }
#cur {
  position:fixed; pointer-events:none; z-index:10;
  width:20px; height:20px; transform:translate(-2px,-2px);
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg id="cur" viewBox="0 0 20 20">
  <polygon points="3,2 3,16 7,12 9,18 12,17 10,11 14,11"
           fill="#fff" stroke="#222" stroke-width="0.8"/>
</svg>
<div id="ui">3D Text Editor<br>Action: <b id="act">loading…</b>&nbsp;&nbsp;Letter: <b id="let">—</b></div>

<script>
// ─── Canvas / GL setup ───────────────────────────────────────────────────────
const C = document.getElementById('c');
const gl = C.getContext('webgl2') || C.getContext('webgl');

// We'll do all rendering on a 2D offscreen canvas via CSS-3D perspective,
// but use real WebGL for the metallic shaded letter geometry.

// Actually we'll do a pure-CSS3D + SVG text approach so zero dependencies.
// Each letter is a <div> that we translate/rotate/scale in 3D.

// ─── Build the stage ─────────────────────────────────────────────────────────
C.style.display = 'none'; // not using raw webgl – using CSS 3D instead

const stage = document.createElement('div');
Object.assign(stage.style, {
  position:'fixed', top:0, left:0,
  width:'100vw', height:'100vh',
  perspective:'800px', perspectiveOrigin:'50% 45%',
  overflow:'hidden',
});
document.body.appendChild(stage);

// Starfield
const stars = document.createElement('canvas');
stars.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;';
stage.insertBefore(stars, stage.firstChild);
function drawStars() {
  stars.width = innerWidth; stars.height = innerHeight;
  const ctx = stars.getContext('2d');
  ctx.fillStyle = '#08081a';
  ctx.fillRect(0,0,innerWidth,innerHeight);
  for (let i=0;i<200;i++) {
    const x=Math.random()*innerWidth, y=Math.random()*innerHeight;
    const r=Math.random()*1.2;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=`rgba(180,200,255,${Math.random()*0.7+0.1})`;
    ctx.fill();
  }
  // Grid lines at bottom
  ctx.strokeStyle='rgba(30,40,80,0.6)'; ctx.lineWidth=1;
  const gY = innerHeight*0.78;
  for (let x=0;x<innerWidth;x+=40) {
    ctx.beginPath(); ctx.moveTo(x,gY); ctx.lineTo(innerWidth/2, gY-80);
    ctx.stroke();
  }
}
drawStars();
window.addEventListener('resize', drawStars);

// ─── 3-D scene container (CSS transform-style: preserve-3d) ─────────────────
const scene = document.createElement('div');
Object.assign(scene.style, {
  position:'absolute',
  top:'45%', left:'50%',
  transformStyle:'preserve-3d',
  transform:'translate(-50%,-50%) rotateX(8deg)',
  transition:'none',
});
stage.appendChild(scene);

// ─── Colour palette ──────────────────────────────────────────────────────────
const PALETTE = [
  '#7ec8ff','#88aaff','#aabbff','#ccaaff','#ffaaee',
  '#ffbbaa','#aaffcc','#aaeecc','#eeffaa','#aaccff',
  '#bbaaff','#ffccaa',
];

// ─── Letter class ────────────────────────────────────────────────────────────
const WORD = 'amalgamation';
const letters = [];

// font-size in px
const FS = 72;
const GAP = 4;

// Measure total width with a temp canvas
function measureWord() {
  const tmp = document.createElement('canvas').getContext('2d');
  tmp.font = `900 ${FS}px 'Arial Black', Arial, sans-serif`;
  let x = 0;
  return WORD.split('').map(ch => {
    const w = tmp.measureText(ch).width;
    const out = { ch, x, w };
    x += w + GAP;
    return out;
  });
}

const metrics = measureWord();
const totalW = metrics[metrics.length-1].x + metrics[metrics.length-1].w;

metrics.forEach((m, i) => {
  const el = document.createElement('div');
  const color = PALETTE[i % PALETTE.length];

  Object.assign(el.style, {
    position: 'absolute',
    left: '0', top: '0',
    font: `900 ${FS}px 'Arial Black', Arial, sans-serif`,
    color: color,
    textShadow: `0 0 20px ${color}88, 0 2px 0 #0004, 2px 0 0 #fff2`,
    cursor: 'default',
    userSelect: 'none',
    whiteSpace: 'nowrap',
    lineHeight: '1',
    transformStyle: 'preserve-3d',
    willChange: 'transform',
    // start position: centred
    transform: `translate3d(${m.x - totalW/2}px, ${-FS/2}px, 0px)`,
  });
  el.textContent = m.ch;
  scene.appendChild(el);

  letters.push({
    el,
    ch: m.ch,
    color,
    // "home" transform state
    home: { tx: m.x - totalW/2, ty: -FS/2, tz: 0, rx: 0, ry: 0, rz: 0, sx: 1, sy: 1, sz: 1 },
    // current interpolated state
    cur:  { tx: m.x - totalW/2, ty: -FS/2, tz: 0, rx: 0, ry: 0, rz: 0, sx: 1, sy: 1, sz: 1 },
  });
});

function applyTransform(l) {
  const s = l.cur;
  l.el.style.transform =
    `translate3d(${s.tx}px,${s.ty}px,${s.tz}px) ` +
    `rotateX(${s.rx}rad) rotateY(${s.ry}rad) rotateZ(${s.rz}rad) ` +
    `scale3d(${s.sx},${s.sy},${s.sz})`;
}

// ─── Cursor ──────────────────────────────────────────────────────────────────
const curEl = document.getElementById('cur');
let cx = innerWidth/2, cy = innerHeight/2;

function getCursorStyle() { return 'default'; }

// ─── Helpers ─────────────────────────────────────────────────────────────────
const actEl = document.getElementById('act');
const letEl = document.getElementById('let');

function rand(a,b){ return a + Math.random()*(b-a); }
function eio(t){ return t<.5?2*t*t:-1+(4-2*t)*t; }
function lerp(a,b,t){ return a+(b-a)*t; }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

// 3-D project: get approximate screen coords for a letter's centre
function screenOf(l) {
  const s = l.cur;
  // scene is centred at (50vw, 45vh), perspective 800px
  // We skip the CSS perspective math and just use the current position + a rough projection
  const fov = 800;
  const depth = fov / (fov - s.tz);
  return {
    x: innerWidth/2  + s.tx * depth,
    y: innerHeight*0.45 + (s.ty + FS/2) * depth,
  };
}

// ─── Cursor movement (bezier with jitter) ────────────────────────────────────
function moveCursor(tx, ty, dur) {
  return new Promise(resolve => {
    const sx=cx, sy=cy;
    const dist = Math.hypot(tx-sx, ty-sy);
    const cp1x = sx+(tx-sx)*0.3 + rand(-1,1)*dist*0.25;
    const cp1y = sy+(ty-sy)*0.3 + rand(-1,1)*dist*0.25;
    const cp2x = sx+(tx-sx)*0.7 + rand(-1,1)*dist*0.15;
    const cp2y = sy+(ty-sy)*0.7 + rand(-1,1)*dist*0.15;
    const t0 = performance.now();
    function tick() {
      const t = Math.min((performance.now()-t0)/(dur*1000), 1);
      const e = eio(t);
      const mt = 1-e;
      cx = mt*mt*mt*sx + 3*mt*mt*e*cp1x + 3*mt*e*e*cp2x + e*e*e*tx;
      cy = mt*mt*mt*sy + 3*mt*mt*e*cp1y + 3*mt*e*e*cp2y + e*e*e*ty;
      // hand tremor
      const jitter = (1-t)*2;
      cx += rand(-jitter, jitter);
      cy += rand(-jitter, jitter);
      curEl.style.left = cx+'px';
      curEl.style.top  = cy+'px';
      if(t<1) requestAnimationFrame(tick); else resolve();
    }
    requestAnimationFrame(tick);
  });
}

// ─── Letter animation ─────────────────────────────────────────────────────────
function animLetter(l, to, dur) {
  return new Promise(resolve => {
    const from = {...l.cur};
    const t0 = performance.now();
    function tick() {
      const t = Math.min((performance.now()-t0)/(dur*1000), 1);
      const e = eio(t);
      for (const k of Object.keys(to)) {
        l.cur[k] = lerp(from[k], to[k], e);
      }
      applyTransform(l);
      // cursor follows letter (smooth lag)
      if (t < 1) {
        const sp = screenOf(l);
        cx += (sp.x - cx) * 0.1;
        cy += (sp.y - cy) * 0.1;
        curEl.style.left = cx+'px';
        curEl.style.top  = cy+'px';
        requestAnimationFrame(tick);
      } else {
        resolve();
      }
    }
    requestAnimationFrame(tick);
  });
}

// ─── Scene camera sway ───────────────────────────────────────────────────────
let t0cam = performance.now();
function swayScene() {
  const t = (performance.now()-t0cam)/1000;
  const ry = Math.sin(t*0.17)*8;
  const rx = 8 + Math.sin(t*0.13)*3;
  scene.style.transform =
    `translate(-50%,-50%) rotateX(${rx}deg) rotateY(${ry}deg)`;
  requestAnimationFrame(swayScene);
}
swayScene();

// ─── Main sequence ────────────────────────────────────────────────────────────
async function run() {
  await wait(600);
  const OPS = ['translate','rotate','scale','translate+rotate','translate+scale'];

  while (true) {
    const count = Math.floor(rand(3, 7));
    const idxs = [...Array(letters.length).keys()]
      .sort(()=>Math.random()-.5).slice(0, count);

    for (const idx of idxs) {
      const l = letters[idx];
      letEl.textContent = l.ch.toUpperCase();
      actEl.textContent = 'selecting…';

      // move cursor to letter
      const sp = screenOf(l);
      await moveCursor(sp.x + rand(-8,8), sp.y + rand(-8,8), rand(0.5,1.1));
      await wait(rand(80,200));

      // click flash
      l.el.style.textShadow = `0 0 40px #fff, 0 0 20px ${l.color}`;
      await wait(80);
      l.el.style.textShadow = `0 0 20px ${l.color}88, 0 2px 0 #0004, 2px 0 0 #fff2`;

      // pick operation
      const op = OPS[Math.floor(Math.random()*OPS.length)];
      actEl.textContent = op;

      const to = {...l.cur};
      if (op.includes('translate')) {
        to.tx += rand(-120, 120);
        to.ty += rand(-80, 80);
        to.tz += rand(-160, 160);
      }
      if (op.includes('rotate')) {
        to.rx += rand(-Math.PI, Math.PI);
        to.ry += rand(-Math.PI, Math.PI);
        to.rz += rand(-0.8, 0.8);
      }
      if (op.includes('scale')) {
        const s = rand(0.4, 2.4);
        to.sx = s; to.sy = s; to.sz = s;
      }

      await animLetter(l, to, rand(0.7, 1.6));
      // update cur state
      Object.assign(l.cur, to);
      await wait(rand(100, 320));
    }

    // Return home
    actEl.textContent = 'reset'; letEl.textContent = '—';
    await wait(350);

    for (const idx of idxs) {
      const l = letters[idx];
      const sp = screenOf(l);
      await moveCursor(sp.x + rand(-6,6), sp.y + rand(-6,6), rand(0.35, 0.7));
      await animLetter(l, {...l.home}, rand(0.55, 1.0));
      Object.assign(l.cur, l.home);
      await wait(rand(50, 160));
    }

    await wait(rand(500, 1200));
  }
}
run();
</script>
</body>
</html>
