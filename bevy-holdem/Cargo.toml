[package]
name = "cartoon-holdem-bevy"
version = "0.1.0"
edition = "2021"
description = "Cartoon Texas Hold'em — Bevy 3D version (native desktop)."

[dependencies]
# `wav` adds WAV decoding for the sound effects (audio/vorbis are already on
# via the default 2d/3d features).
bevy = { version = "0.18", features = ["wav"] }

# Faster incremental builds while keeping deps optimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
