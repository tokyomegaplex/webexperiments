// ── Math helpers ───────────────────────────────────────────────────────
const lerp=(a,b,t)=>a+(b-a)*t;

const randInt=(a,b)=>Math.floor(rand(a,b+.999));

// Smooth correlated noise — uses layered sines so jitter feels organic not jittery
let _nT=Math.random()*50;
function smoothNoise(dt, freq=6){
  _nT+=dt;
  return Math.sin(_nT*freq + Math.sin(_nT*freq*0.41)) *
         Math.cos(_nT*freq*0.73 + Math.sin(_nT*freq*0.17));
}

// Ease in-out cubic
function easeInOut(t){ return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

// Build a slightly arced quadratic bezier path for human-like transit
// The arc bows perpendicular to the direction — magnitude scales with distance
function arcPath(x0,y0,x1,y1,steps=25){
  const dx=x1-x0, dy=y1-y0, len=Math.hypot(dx,dy);
  if(len<4) return [{x:x1,y:y1}];
  // Perpendicular nudge: small for short moves, more for long ones, always random direction
  const bow = (Math.random()-.5) * Math.min(len*0.28, 90);
  const mx=(x0+x1)/2, my=(y0+y1)/2;
  const px=-dy/len, py=dx/len;           // unit perpendicular
  const cpx=mx+px*bow, cpy=my+py*bow;   // bezier control point
  const result=[];
  for(let i=1;i<=steps;i++){
    const t=easeInOut(i/steps), u=1-t;
    result.push({ x:u*u*x0+2*u*t*cpx+t*t*x1, y:u*u*y0+2*u*t*cpy+t*t*y1 });
  }
  return result;
}

function catmullSample(pts, density=15){
  if(pts.length<2) return pts.map(p=>({x:p[0],y:p[1]}));
  const res=[], N=pts.length;
  const ext=[pts[0],...pts,pts[N-1]];
  for(let i=1;i<ext.length-2;i++){
    const [p0,p1,p2,p3]=[ext[i-1],ext[i],ext[i+1],ext[i+2]];
    const segLen=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);
    const steps=Math.max(3,Math.round(segLen*density));
    for(let j=0;j<steps;j++){
      const t=j/steps,t2=t*t,t3=t2*t;
      res.push({
        x:.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
        y:.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
      });
    }
  }
  res.push({x:pts[N-1][0],y:pts[N-1][1]});
  return res;
}

// ── Flood fill ─────────────────────────────────────────────────────────
function floodFill(px,py,fillHex){
  px=Math.round(px); py=Math.round(py);
  if(px<0||px>=CW||py<0||py>=CH) return;
  const img=ctx.getImageData(0,0,CW,CH),d=img.data;
  const i0=(py*CW+px)*4;
  const [tr,tg,tb]=[d[i0],d[i0+1],d[i0+2]];
  const [fr,fg,fb]=hexToRgb(fillHex);
  if(tr===fr&&tg===fg&&tb===fb) return;
  const stk=[px+py*CW],vis=new Uint8Array(CW*CH);
  let n=0;
  while(stk.length&&n<2e6){
    n++; const pos=stk.pop();
    if(vis[pos]) continue; vis[pos]=1;
    const x=pos%CW,y=(pos/CW)|0,ii=pos*4;
    if(Math.abs(d[ii]-tr)>28||Math.abs(d[ii+1]-tg)>28||Math.abs(d[ii+2]-tb)>28) continue;
    d[ii]=fr;d[ii+1]=fg;d[ii+2]=fb;d[ii+3]=255;
    if(x>0) stk.push(pos-1);
    if(x<CW-1) stk.push(pos+1);
    if(y>0) stk.push(pos-CW);
    if(y<CH-1) stk.push(pos+CW);
  }
  ctx.putImageData(img,0,0);
}

  get idle(){ return this.queue.length===0; },

  enqueue(pts, spd, dn){
    pts.forEach(p=>this.queue.push({x:p.x,y:p.y,spd:spd||500,dn:!!dn}));
  },

  setTool(t){
    this.tool=t;
    curEl.innerHTML = CSR[t]||CSR.arrow;
    document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('active'));
    const btn=document.getElementById('btn-'+t);
    if(btn) btn.classList.add('active');
    stTool.textContent=t.charAt(0).toUpperCase()+t.slice(1);
  },

  setColor(hex){
    this.color=hex;
    fgSw.style.background=hex;
    document.querySelectorAll('.sw.cur').forEach(s=>s.classList.remove('cur'));
    const s=document.querySelector('.sw[data-c="'+hex+'"]');
    if(s) s.classList.add('cur');
  },

  setSize(s){
    this.size=s;
    document.querySelectorAll('.szo').forEach(el=>el.classList.remove('active'));
    const el=document.querySelector('.szo[data-s="'+s+'"]');
    if(el) el.classList.add('active');
  },

  update(dt){
    if(!this.queue.length) return;
    const tgt=this.queue[0];

    if(tgt.fast){
      // Fast drawing: drain the full pixel budget across as many waypoints as needed per frame
      let budget=tgt.spd*dt;
      while(this.queue.length && this.queue[0].fast && budget>0.3){
        const t=this.queue[0];
        const dx=t.x-this.x, dy=t.y-this.y;
        const d=Math.hypot(dx,dy);
        if(d<0.5){ this.x=t.x; this.y=t.y; this.drawing=t.dn; this.queue.shift(); continue; }
        const step=Math.min(d,budget); budget-=step;
        const nx=this.x+(dx/d)*step;
        const ny=this.y+(dy/d)*step;
        applyStroke(this.x,this.y,nx,ny);
        this.x=nx; this.y=ny; this.drawing=t.dn;
        if(d-step<0.5){ this.x=t.x; this.y=t.y; this.queue.shift(); }
      }
    } else {
      // Transit mode: ease-in from rest, ease-out near target
      const dx=tgt.x-this.x, dy=tgt.y-this.y;
      const d=Math.hypot(dx,dy);
      if(d<0.5){ this.x=tgt.x; this.y=tgt.y; this.drawing=tgt.dn; this.queue.shift(); return; }
      tgt._age=(tgt._age||0)+dt;
      const easeIn=Math.min(1,tgt._age/0.08);
      const easeOut=Math.min(1,d/45);
      const sm=Math.max(0.12,Math.min(easeIn,easeOut));
      const step=Math.min(d,tgt.spd*dt*(0.18+sm*0.82));
      const noiseAmp=tgt.dn?0.85:0;
      const wx=noiseAmp*smoothNoise(dt,5.8);
      const wy=noiseAmp*smoothNoise(dt,4.4)*Math.cos(_nT*0.3);
      const nx=this.x+(dx/d)*step+wx;
      const ny=this.y+(dy/d)*step+wy;
      if(tgt.dn) applyStroke(this.x,this.y,nx,ny);
      this.x=nx; this.y=ny; this.drawing=tgt.dn;
      stPos.textContent=Math.round(nx)+', '+Math.round(ny);
    }
  }
};

// ── Coordinate helpers ────────────────────────────────────────────────
// Get canvas pixel offset within #app
function canvasOffset(){
  const cr=canvas.getBoundingClientRect(), ar=app.getBoundingClientRect();
  return {ox:cr.left-ar.left, oy:cr.top-ar.top};
}
// Canvas pixel → app position
function cvToApp(cx,cy){ const {ox,oy}=canvasOffset(); return {x:cx+ox,y:cy+oy}; }
// App position → canvas pixel
function appToCv(ax,ay){ const {ox,oy}=canvasOffset(); return {x:ax-ox,y:ay-oy}; }
// Center of DOM element in app coords
function elCenter(el){
  const r=el.getBoundingClientRect(), ar=app.getBoundingClientRect();
  return {x:r.left-ar.left+r.width/2, y:r.top-ar.top+r.height/2};
}

// ── Drawing engine ─────────────────────────────────────────────────────
function applyStroke(ax1,ay1,ax2,ay2){
  const {ox,oy}=canvasOffset();
  const x1=ax1-ox, y1=ay1-oy, x2=ax2-ox, y2=ay2-oy;
  const tool=cur.tool, color=cur.color, size=cur.size;

  if(tool==='pencil'){
    ctx.save();
    ctx.strokeStyle=color;
    ctx.lineWidth=Math.max(2, size);
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.globalAlpha=1;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.restore();
  } else if(tool==='brush'){
    const len=Math.hypot(x2-x1,y2-y1);
    const steps=Math.max(1,Math.round(len/2));
    const r=Math.max(3, size*2.2);
    ctx.save(); ctx.fillStyle=color; ctx.globalAlpha=0.22;
    for(let i=0;i<=steps;i++){
      const t=steps?i/steps:0;
      ctx.beginPath();
      ctx.arc(lerp(x1,x2,t),lerp(y1,y2,t),r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  } else if(tool==='spray'){
    const len=Math.hypot(x2-x1,y2-y1);
    const steps=Math.max(1,Math.round(len/5));
    ctx.save(); ctx.fillStyle=color;
    for(let i=0;i<=steps;i++){
      const t=steps?i/steps:0;
      const bx=lerp(x1,x2,t), by=lerp(y1,y2,t);
      for(let j=0;j<7;j++){
        const a=Math.random()*Math.PI*2, r=Math.random()*size*2.5;
        ctx.globalAlpha=Math.random()*0.55+0.25;
        ctx.beginPath();
        ctx.arc(bx+Math.cos(a)*r, by+Math.sin(a)*r, Math.random()*1.2+0.4, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.restore();
  } else if(tool==='callig'){
    const len=Math.hypot(x2-x1,y2-y1);
    const steps=Math.max(1,Math.round(len/1.5));
    ctx.save(); ctx.fillStyle=color; ctx.globalAlpha=0.95;
    for(let i=0;i<=steps;i++){
      const t=steps?i/steps:0;
      ctx.save();
      ctx.translate(lerp(x1,x2,t), lerp(y1,y2,t));
      ctx.rotate(Math.PI/4.2);
      ctx.fillRect(-size*2.2,-size*.5,size*4.4,size);
      ctx.restore();
    }
    ctx.restore();
  } else if(tool==='shade'){
    // Sphere-shaded brush: each dab is a radial gradient with upper-left specular highlight
    const len=Math.hypot(x2-x1,y2-y1);
    const steps=Math.max(1,Math.round(len/3));
    const r=Math.max(6, size*3.5);
    const [cr2,cg2,cb2]=hexToRgb(color);
    const dr=Math.max(0,cr2-45), dg=Math.max(0,cg2-45), db=Math.max(0,cb2-45);
    ctx.save();
    for(let i=0;i<=steps;i++){
      const t=steps?i/steps:0;
      const bx=lerp(x1,x2,t), by=lerp(y1,y2,t);
      const grd=ctx.createRadialGradient(bx-r*0.32,by-r*0.32,r*0.02,bx,by,r);
      grd.addColorStop(0,    'rgba(255,255,255,0.75)');
      grd.addColorStop(0.22,  color);
      grd.addColorStop(0.65, `rgba(${dr},${dg},${db},0.9)`);
      grd.addColorStop(1,    `rgba(${dr},${dg},${db},0)`); // fade to same color, not black
      ctx.globalAlpha=0.90;
      ctx.fillStyle=grd;
      ctx.beginPath(); ctx.arc(bx,by,r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}


// ── Word layout helpers ───────────────────────────────────────────────
// Add organic hand-tremor variation to normalized letter stroke points
function jitterStroke(stroke, amt){
  return stroke.map((pt,i)=>{
    const edge=Math.min(i,stroke.length-1-i)/(stroke.length*0.25+1);
    const f=Math.min(1,edge);
    return [pt[0]+(Math.random()-.5)*2*amt*f, pt[1]+(Math.random()-.5)*2*amt*f*0.7];
  });
}

function wordTotalWidth(h, spc=0.18){
  let w=0;
  for(const ch of WORD){
    const d=STROKES[ch]; if(!d) continue;
    w+=d.w*h+spc*h;
  }
  return w-spc*h;
}

// Get canvas [x,y] points for each stroke of a letter, given origin
// jitter adds hand-drawn irregularity (normalized units, 0=none)
function letterCanvasPaths(ch, ox, oy, h, jitter=0.038){
  const d=STROKES[ch]; if(!d) return [];
  const lw=d.w*h;
  return d.s.map(stroke=>{
    const jit=jitter>0 ? jitterStroke(stroke,jitter) : stroke;
    return catmullSample(jit,10).map(p=>({x:ox+p.x*lw, y:oy+p.y*h}));
  });
}

// ── Selection / transform state ───────────────────────────────────────
let selRect=null;   // {x,y,w,h} in canvas pixels
let selData=null;   // saved ImageData
let dashOff=0;
let textCursor=null; // {x,y,h} in canvas pixels — the blinking insertion caret

function drawMarchingAnts(){
  if(!selRect) return;
  selCtx.clearRect(0,0,CW,CH);
  const {x,y,w,h}=selRect;
  selCtx.save();

  // White layer then black dashed — gives marching ant look on any background
  selCtx.setLineDash([5,5]);
  selCtx.lineWidth=1;
  selCtx.strokeStyle='#fff';
  selCtx.lineDashOffset=-dashOff;
  selCtx.strokeRect(x+.5,y+.5,w,h);
  selCtx.strokeStyle='#000';
  selCtx.lineDashOffset=-dashOff+5;
  selCtx.strokeRect(x+.5,y+.5,w,h);

  // 8 resize handles: 4 corners + 4 edge midpoints
  const HS=6; // handle size px
  const handles=[
    [x,     y      ],[x+w/2, y      ],[x+w,   y      ],
    [x,     y+h/2  ],                 [x+w,   y+h/2  ],
    [x,     y+h    ],[x+w/2, y+h    ],[x+w,   y+h    ],
  ];
  selCtx.setLineDash([]);
  handles.forEach(([hx,hy])=>{
    selCtx.fillStyle='#fff';
    selCtx.fillRect(hx-HS/2, hy-HS/2, HS, HS);
    selCtx.strokeStyle='#555';
    selCtx.lineWidth=1;
    selCtx.strokeRect(hx-HS/2+.5, hy-HS/2+.5, HS-1, HS-1);
  });
  selCtx.restore();
}

// ── Async helpers ──────────────────────────────────────────────────────
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function waitIdle(){
  return new Promise(r=>{
    (function chk(){ cur.idle?r():requestAnimationFrame(chk); })();
  });
}
// Move cursor to app position — travels on a natural arced bezier path
async function moveTo(x,y,spd=2500){
  const path=arcPath(cur.x,cur.y,x,y);
  cur.enqueue(path,spd,false);
  await waitIdle();
  // Very brief settle (skip most of the time)
  if(Math.random()<0.3) await sleep(rand(5,18));
}
// Move cursor to canvas pixel
async function moveToC(cx,cy,spd=2500){
  const p=cvToApp(cx,cy); await moveTo(p.x,p.y,spd);
}
// Draw along canvas-pixel path — lifts pen, moves to start, then draws
async function drawPath(pts, spd=1600){
  if(!pts.length) return;
  const {ox,oy}=canvasOffset();
  // Move to stroke start (pen up) — arc travel
  const startApp={x:pts[0].x+ox, y:pts[0].y+oy};
  const transit=arcPath(cur.x,cur.y,startApp.x,startApp.y);
  cur.enqueue(transit, 4000, false);
  await waitIdle();
  // Tiny hesitation before pen touches paper
  await sleep(rand(2,8));
  // Draw the stroke (pen down, fast=true skips easing)
  if(pts.length>1)
    cur.enqueue(pts.slice(1).map(p=>({x:p.x+ox,y:p.y+oy,fast:true})), spd, true);
  await waitIdle();
  // Micro-stutter after stroke: rare brief stop
  if(Math.random()<0.10) await sleep(rand(10,30));
}
// Animate cursor to toolbar button, update state
async function switchTool(t){
  const btn=document.getElementById('btn-'+t);
  if(btn){ await moveTo(...Object.values(elCenter(btn)),2800); await sleep(rand(12,25)); }
  cur.setTool(t); await sleep(rand(8,15));
}
// Animate cursor to palette swatch, update state
async function pickColor(hex){
  const sw=document.querySelector('.sw[data-c="'+hex+'"]');
  if(sw){ await moveTo(...Object.values(elCenter(sw)),2800); await sleep(rand(8,18)); }
  cur.setColor(hex); await sleep(rand(5,12));
}


// ── Draw word stroke-by-stroke ─────────────────────────────────────────
async function drawWordStrokes(letterH, spc=0.18, startX=null, startY=null){
  const tw=wordTotalWidth(letterH,spc);
  const sx = startX !== null ? startX : Math.max(10,(CW-tw)/2);
  const sy = startY !== null ? startY : (CH-letterH)/2 - letterH*0.1;
  let cx=sx;
  for(const ch of WORD){
    // Randomly pick upper or lowercase variant if both exist
    const lower=ch.toLowerCase();
    const key=(STROKES[lower]&&Math.random()<0.5)?lower:ch;
    const d=STROKES[key]; if(!d){cx+=letterH*spc;continue;}
    // Per-letter: slight size wobble + baseline drift = hand-drawn feel
    const lh=letterH*rand(0.93,1.07);
    const baseWobble=rand(-letterH*0.06,letterH*0.06);
    const paths=letterCanvasPaths(key,cx,sy+baseWobble,lh);
    const spd = cur.tool==='spray'?5000 : cur.tool==='brush'?4000 : cur.tool==='callig'?4500 : cur.tool==='shade'?4000 : 5000;
    for(const p of paths){
      await drawPath(p, spd);
      await sleep(rand(3,10));
    }
    cx+=d.w*lh+spc*letterH;
    await sleep(rand(8,25));
  }
}

// ── Two-line word drawing (for large sizes) ───────────────────────────
async function drawWordTwoLines(letterH, spc=0.18){
  const line1='amalga', line2='mation';
  for(const [line, lineY] of [[line1, CH*0.28],[line2, CH*0.62]]){
    let tw=0;
    for(const ch of line){ const d=STROKES[ch]; if(d) tw+=d.w*letterH+spc*letterH; }
    tw-=spc*letterH;
    let cx=Math.max(10,(CW-tw)/2);
    const startY=lineY-letterH*0.5;
    for(const ch of line){
      const d=STROKES[ch]; if(!d){cx+=letterH*spc;continue;}
      const paths=letterCanvasPaths(ch,cx,startY,letterH);
      const spd=cur.tool==='spray'?5000:cur.tool==='brush'?4000:cur.tool==='shade'?4000:4500;
      for(const p of paths){ await drawPath(p,spd); await sleep(rand(2,8)); }
      cx+=d.w*letterH+spc*letterH;
      await sleep(rand(6,20));
    }
    await sleep(rand(100,300));
  }
}

// ── Bubble letter drawing ─────────────────────────────────────────────
// Font options for the text tool — variety of styles
const TEXT_FONTS=[
  {fnt:h=>`bold ${Math.round(h*1.1)}px "Arial Black",Impact,Arial,sans-serif`, style:'bubble'},
  {fnt:h=>`bold ${Math.round(h)}px Arial,Helvetica,sans-serif`,                style:'solid'},
  {fnt:h=>`bold italic ${Math.round(h)}px Georgia,"Times New Roman",serif`,    style:'solid'},
  {fnt:h=>`${Math.round(h*0.95)}px "Courier New",Courier,monospace`,           style:'solid'},
  {fnt:h=>`bold ${Math.round(h*1.05)}px Impact,Haettenschweiler,sans-serif`,   style:'outline'},
  {fnt:h=>`bold italic ${Math.round(h*0.9)}px "Comic Sans MS",cursive`,        style:'solid'},
  {fnt:h=>`bold ${Math.round(h*1.1)}px "Arial Black",Impact,Arial,sans-serif`, style:'shadow'},
];

async function drawWithTextTool(scheme, letterH){
  // 1. Click text tool
  const btn=document.getElementById('btn-text');
  if(btn){ await moveTo(...Object.values(elCenter(btn)),2800); await sleep(rand(10,20)); }
  cur.setTool('text');
  await sleep(rand(10,20));

  // 2. Pick a font style
  const fontDef=pick(TEXT_FONTS);
  const fnt=fontDef.fnt(letterH);
  const textColor = cur.color;

  // 3. Measure total width to center the text
  // Generate mixed-case version for this cycle
  const displayWord=Array.from(WORD).map(ch=>Math.random()<0.5?ch:ch.toLowerCase()).join('');

  ctx.save(); ctx.font=fnt; ctx.textBaseline='alphabetic';
  const KERN=Math.round(letterH*0.02); // tiny inter-char spacing
  let totalW=0;
  for(const ch of displayWord) totalW+=ctx.measureText(ch).width+KERN;
  totalW-=KERN;
  ctx.restore();

  const textX=Math.max(12, rand(10, Math.max(12, CW-totalW-10)));
  const baseY=rand(letterH*1.1, CH-letterH*0.4);
  const caretTop=baseY-letterH*0.92;
  const caretH=letterH*1.1;

  // 4. Move cursor to text start and click to place insertion point
  await moveToC(textX-8, baseY-letterH*0.5, 2500);
  await sleep(rand(20,50));

  // Place blinking caret
  textCursor={x:textX, y:caretTop, h:caretH};

  // Short beat before typing starts
  await sleep(rand(80,200));

  // 5. Type each character
  let insertX=textX;
  for(let ci=0;ci<displayWord.length;ci++){
    const ch=displayWord[ci];

    // Human typing rhythm: mostly fast, occasional pauses
    const r=Math.random();
    const delay = r<0.08 ? rand(280,550)   // long hesitation
                : r<0.25 ? rand(120,220)  // medium pause
                :           rand(55,110); // normal keystroke
    await sleep(delay);

    // Render character
    ctx.save(); ctx.font=fnt; ctx.textBaseline='alphabetic';
    if(fontDef.style==='bubble'){
      ctx.lineJoin='round'; ctx.lineWidth=letterH/3;
      ctx.strokeStyle=scheme.out; ctx.strokeText(ch,insertX,baseY);
      ctx.fillStyle=scheme.fill; ctx.fillText(ch,insertX,baseY);
      ctx.globalAlpha=0.22; ctx.fillStyle='#fff'; ctx.fillText(ch,insertX,baseY);
    } else if(fontDef.style==='outline'){
      ctx.lineJoin='round'; ctx.lineWidth=Math.max(1.5,letterH/9);
      ctx.strokeStyle=textColor; ctx.strokeText(ch,insertX,baseY);
    } else if(fontDef.style==='shadow'){
      // Shadow offset
      ctx.fillStyle='rgba(0,0,0,0.25)';
      ctx.fillText(ch,insertX+3,baseY+3);
      ctx.fillStyle=scheme.fill; ctx.fillText(ch,insertX,baseY);
    } else {
      ctx.fillStyle=textColor; ctx.fillText(ch,insertX,baseY);
    }
    // Measure BEFORE restore so font context is still set
    const cw=ctx.measureText(ch).width;
    ctx.restore();

    insertX+=cw+KERN;

    // Advance caret
    textCursor.x=insertX;

    // Nudge the mouse cursor slightly right — watching the text appear
    const approxApp=cvToApp(insertX+2, baseY-letterH*0.35);
    cur.x=approxApp.x+(Math.random()-.5)*3;
    cur.y=approxApp.y+(Math.random()-.5)*3;
  }

  // Brief blink at end then dismiss
  await sleep(rand(80,220));
  textCursor=null;
  selCtx.clearRect(0,0,CW,CH);
}

// ── Bucket fill action ────────────────────────────────────────────────
async function doBucketFill(fillColor){
  await switchTool('bucket');
  cur.setColor(fillColor);
  const fx=CW/2+rand(-80,80), fy=CH/2+rand(-30,30);
  await moveToC(fx,fy,2500);
  await sleep(30);
  floodFill(fx,fy,fillColor);
  await sleep(60);
}

// ── Selection + transform ─────────────────────────────────────────────
async function doSelectTransform(){
  await switchTool('select');
  await sleep(30);

  const sx=CW*0.20, sy=CH*0.20, sw=CW*0.60, sh=CH*0.60;
  const p0=cvToApp(sx,sy);
  await moveTo(p0.x,p0.y,2500);
  await sleep(20);

  selRect={x:sx,y:sy,w:0,h:0};
  const steps=40;
  for(let i=1;i<=steps;i++){
    const t=i/steps;
    const nx=cvToApp(sx+sw*t,sy+sh*t);
    cur.enqueue([{x:nx.x,y:nx.y}],1800,false);
    selRect.w=sw*t; selRect.h=sh*t;
  }
  await waitIdle();
  await sleep(100);

  selData=ctx.getImageData(sx,sy,sw,sh);

  const handle=cvToApp(sx+sw,sy+sh);
  await moveTo(handle.x,handle.y,2500);
  await sleep(20);

  const newW=sw*1.35, newH=sh*1.35;
  const newX=sx-(newW-sw)/2, newY=sy-(newH-sh)/2;
  const target=cvToApp(newX+newW,newY+newH);
  cur.enqueue([{x:target.x,y:target.y}],900,false);
  await waitIdle();

  ctx.clearRect(sx-2,sy-2,sw+4,sh+4);
  ctx.fillStyle='#ffffff'; ctx.fillRect(sx-2,sy-2,sw+4,sh+4);
  const tempCvs=document.createElement('canvas');
  tempCvs.width=sw; tempCvs.height=sh;
  tempCvs.getContext('2d').putImageData(selData,0,0);
  ctx.drawImage(tempCvs, newX, newY, newW, newH);
  selRect={x:newX,y:newY,w:newW,h:newH};
  await sleep(120);

  if(Math.random()<0.5){
    const angle=(Math.random()-.5)*0.25;
    const cx2=newX+newW/2, cy2=newY+newH/2;
    ctx.clearRect(newX-5,newY-5,newW+10,newH+10);
    ctx.fillStyle='#ffffff'; ctx.fillRect(newX-5,newY-5,newW+10,newH+10);
    ctx.save();
    ctx.translate(cx2,cy2); ctx.rotate(angle); ctx.translate(-cx2,-cy2);
    ctx.drawImage(tempCvs, newX, newY, newW, newH);
    ctx.restore();
    await sleep(80);
  }

  await moveTo(cvToApp(CW*0.1,CH*0.1).x, cvToApp(CW*0.1,CH*0.1).y, 2500);
  selRect=null; selData=null;
  selCtx.clearRect(0,0,CW,CH);
  await sleep(50);
}


// ── Main director loop ────────────────────────────────────────────────
const TOOLS_STROKE=['pencil','brush','spray','callig','shade'];
let cycleNum=0;

async function runCycle(){
  cycleNum++;
  stAct.textContent='Cycle '+cycleNum+' — choosing style...';

  // --- Randomize style ---
  const useBubble = Math.random()<0.28;
  const scheme    = pick(SCHEMES);
  const letterH   = randInt(50,65); // capped so AMALGAMATION fits on one line

  if(useBubble){
    // --- TEXT TOOL ---
    stAct.textContent='Text tool';
    const textColor=pick(PAL.filter(c=>c!=='#ffffff'&&c!=='#c0c0c0'));
    cur.setColor(textColor);
    await drawWithTextTool(scheme, letterH);

  } else {
    // --- STROKE-BASED ---
    const tool=pick(TOOLS_STROKE);
    const size = tool==='pencil'?randInt(2,4):
                 tool==='callig'?randInt(3,6):
                 tool==='spray'?randInt(3,5):randInt(3,7);

    const darkColors=PAL.filter(c=>c!=='#ffffff'&&c!=='#c0c0c0'&&c!=='#aaffaa'&&c!=='#ffaacc');
    const color=pick(darkColors);

    stAct.textContent='Switching to '+tool+'...';
    await switchTool(tool);
    await pickColor(color);
    cur.setSize(size);
    await sleep(20);

    // Random position across canvas
    const tw=wordTotalWidth(letterH);
    const rx=rand(10, Math.max(12, CW-tw-10));
    const ry=rand(letterH*0.2, CH-letterH*1.3);
    stAct.textContent='Writing ('+tool+')...';
    await drawWordStrokes(letterH, 0.18, rx, ry);
  }

  // --- Maybe a second pass at different size/position ---
  if(Math.random()<0.35){
    const tool2=pick(TOOLS_STROKE);
    const scheme2=pick(SCHEMES);
    const size2=tool2==='pencil'?randInt(1,2):randInt(1,4);
    stAct.textContent='Second pass ('+tool2+')...';
    await switchTool(tool2);
    await pickColor(scheme2.fill);
    cur.setSize(size2);
    await sleep(15);
    const h2=randInt(25,48);
    const tw2=wordTotalWidth(h2);
    const rx2=rand(10, Math.max(12, CW-tw2-10));
    const ry2=rand(h2*0.2, CH-h2*1.3);
    await drawWordStrokes(h2, 0.22, rx2, ry2);
  }

  // --- Admire briefly ---
  stAct.textContent='...';
  await sleep(rand(200,600));
}

async function directorLoop(){
  while(true){
    try{ await runCycle(); }
    catch(e){ console.error('Cycle error:',e); await sleep(1000); }
    await sleep(200);
  }
}

// ── Positioning of selcvs over canvas ────────────────────────────────
function positionOverlay(){
  // selcvs is a sibling of canvas inside cwrap; position it to exactly overlay the canvas
  const cr=canvas.getBoundingClientRect(), wr=cwrap.getBoundingClientRect();
  selCvs.style.left=(cr.left-wr.left)+'px';
  selCvs.style.top=(cr.top-wr.top)+'px';
  selCvs.style.width=cr.width+'px';
  selCvs.style.height=cr.height+'px';
}

// ── Main animation loop ───────────────────────────────────────────────
let lastTs=0;
function animLoop(ts){
  const dt=Math.min((ts-lastTs)/1000,0.05);
  lastTs=ts;

  cur.update(dt);

  // Update cursor element
  curEl.style.transform=`translate(${cur.x}px,${cur.y}px)`;

  // Marching ants (selection)
  if(selRect){
    dashOff=(dashOff+0.15)%10;
    drawMarchingAnts();
  }

  // Blinking text insertion caret
  if(textCursor && !selRect){
    const blink=Math.floor(Date.now()/500)%2===0;
    selCtx.clearRect(textCursor.x-5,textCursor.y-2,12,textCursor.h+4);
    if(blink){
      selCtx.save();
      selCtx.fillStyle='#000';
      // Vertical bar
      selCtx.fillRect(textCursor.x,textCursor.y,2,textCursor.h);
      // Serifs
      selCtx.fillRect(textCursor.x-4,textCursor.y,10,2);
      selCtx.fillRect(textCursor.x-4,textCursor.y+textCursor.h-2,10,2);
      selCtx.restore();
    }
  }

  requestAnimationFrame(animLoop);
}

// ── User interaction ──────────────────────────────────────────────────
// Let the user draw on the canvas and click toolbar/palette buttons
let userDrawing=false;

function userPointerPos(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left),y:(e.clientY-r.top)};
}
function userAppPos(e){
  const r=app.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}

function setupUserInput(){
  // Toolbar buttons — clicking switches tool for both user and AI
  document.querySelectorAll('.tbtn[id^="btn-"]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const t=btn.id.replace('btn-','');
      if(TOOLS_STROKE.includes(t)||t==='text'||t==='bucket'||t==='select'){
        cur.setTool(t);
        e.stopPropagation();
      }
    });
  });

  // Palette swatches — clicking changes color for both user and AI
  document.querySelectorAll('.sw').forEach(sw=>{
    sw.addEventListener('click',e=>{
      cur.setColor(sw.dataset.c);
      e.stopPropagation();
    });
  });

  // Size picker
  document.querySelectorAll('.szo').forEach(el=>{
    el.addEventListener('click',e=>{
      cur.setSize(Number(el.dataset.s));
      e.stopPropagation();
    });
  });

  // Canvas drawing — user draws with current tool
  let lastUx=0, lastUy=0;
  canvas.addEventListener('pointerdown',e=>{
    if(cur.tool==='pencil'||cur.tool==='brush'||cur.tool==='spray'||cur.tool==='callig'||cur.tool==='shade'){
      userDrawing=true;
      canvas.setPointerCapture(e.pointerId);
      const p=userPointerPos(e);
      lastUx=p.x; lastUy=p.y;
    }
  });
  canvas.addEventListener('pointermove',e=>{
    if(!userDrawing) return;
    const p=userPointerPos(e);
    applyStroke(lastUx + canvasOffset().ox, lastUy + canvasOffset().oy,
                p.x    + canvasOffset().ox, p.y    + canvasOffset().oy);
    lastUx=p.x; lastUy=p.y;
  });
  canvas.addEventListener('pointerup',  ()=>{ userDrawing=false; });
  canvas.addEventListener('pointerleave',()=>{ userDrawing=false; });
}

// ── Init ──────────────────────────────────────────────────────────────
function init(){
  // White canvas
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,CW,CH);

  // Set initial tool & color
  cur.setTool('pencil');
  cur.setColor('#000000');
  cur.setSize(2);

  // Position cursor in center of canvas
  const p=cvToApp(CW/2,CH/2);
  cur.x=p.x; cur.y=p.y;

  // Set cursor SVG
  curEl.innerHTML=CSR.pencil;
  curEl.style.transform=`translate(${cur.x}px,${cur.y}px)`;

  // Position overlay canvas
  positionOverlay();

  // Wire up user input
  setupUserInput();

  // Start loops
  requestAnimationFrame(ts=>{ lastTs=ts; requestAnimationFrame(animLoop); });
  setTimeout(directorLoop, 600);
}

window.addEventListener('load', init);
</script>
